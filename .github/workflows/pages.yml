# Build the static export and publish it to GitHub Pages.
#
# Every route is statically generated, so the site needs no server. This gives
# a browsable preview at https://yuzansama.github.io/titikasalkopi/ while the
# real domain (titikasalkopi.id) is still pointed elsewhere.
#
# One-time manual step: Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer push finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # Job-level on purpose: the assertion suite reads these too, and checking
    # the build against a different origin than it was built with turns
    # correct output into a red gate.
    env:
      STATIC_EXPORT: "1"
      BASE_PATH: /titikasalkopi
      # Pages is the production host now, not a preview. Without this the
      # published robots.txt says `Disallow: /` and blocks every crawler.
      SITE_ENV: production
      # Canonical URLs must point at the address that actually serves the
      # site. Change this to https://titikasalkopi.id once the domain is
      # registered and pointed here, and clear BASE_PATH at the same time.
      NEXT_PUBLIC_SITE_ORIGIN: https://yuzansama.github.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # next-env.d.ts and .next/types are generated, not committed, so a clean
      # runner has no route types and tsc fails before it ever sees real code.
      - run: npx next typegen

      # Data validation, type checking and the cart/WhatsApp/reply-hours
      # assertions all gate the deploy. A broken catalog must not reach Pages.
      - run: npx tsc --noEmit
      - run: npx eslint .

      - name: Build static export
        run: npx next build

      # Runs after the build on purpose: a third of these assertions read the
      # generated HTML (noindex, JSON-LD, prices, basePath on assets), so they
      # have nothing to inspect until the export exists.
      - run: node scripts/check-all.mjs

      # Pages is served by a plain file server; without this, paths beginning
      # with an underscore (_next) are skipped by Jekyll.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
