# Build the static export and publish it to GitHub Pages.
#
# Every route is statically generated, so the site needs no server. This gives
# a browsable preview at https://yuzansama.github.io/titikasalkopi/ while the
# real domain (titikasalkopi.id) is still pointed elsewhere.
#
# One-time manual step: Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer push finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # Job-level on purpose: the assertion suite reads these too, and checking
    # the build against a different origin than it was built with turns
    # correct output into a red gate.
    env:
      STATIC_EXPORT: "1"
      BASE_PATH: /titikasalkopi
      # Pages is the production host now, not a preview. Without this the
      # published robots.txt says `Disallow: /` and blocks every crawler.
      SITE_ENV: production
      # Canonical URLs must point at the address that actually serves the
      # site. Change this to https://titikasalkopi.id once the domain is
      # registered and pointed here, and clear BASE_PATH at the same time.
      NEXT_PUBLIC_SITE_ORIGIN: https://yuzansama.github.io
      # Order-book endpoint for /lacak (FR-51), from docs/08-lacak-pesanan.md
      # section 4. Not a secret, and it could not be one: the buyer's browser
      # is what calls it, so it ships in the client bundle regardless. What
      # protects the data is the column allowlist in ops/order-tracker.gs plus
      # the last-4 check, not the obscurity of this URL.
      # While empty, /lacak still builds and says tracking is not active yet
      # instead of failing silently.
      #
      # Rotating it: use Deploy > Manage deployments > Edit > New version in
      # Apps Script, which keeps this URL. A brand new deployment mints a new
      # URL and needs this line changed.
      NEXT_PUBLIC_TRACKING_ENDPOINT: https://script.google.com/macros/s/AKfycbzGbe4W2zxmPp9fErxcbG9MN2ZSau4qAjmyNNrmSke56_FJvakzr_HAyECwoVWdMQ74RQ/exec
      #
      # The two lines below are the whole of what stands between this site and
      # having any measurement at all. The code for both is written and idle,
      # waiting on a value only the owner can create (docs/12-tugas-owner.md
      # items 4 and 6). Uncomment and fill each one in as it arrives.
      #
      # Without NEXT_PUBLIC_GA_ID the analytics module loads nothing and every
      # event is discarded. Six of the ten project KPIs have no source, and the
      # gap cannot be backfilled - the first weeks after opening are exactly
      # the ones worth reading, and they are only recorded if this is set
      # before launch, not after.
      # NEXT_PUBLIC_GA_ID: G-XXXXXXXXXX
      #
      # Search Console verification. Must be generated under the final origin,
      # so this waits on the domain rather than on anything in the code.
      # GOOGLE_SITE_VERIFICATION: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # next-env.d.ts and .next/types are generated, not committed, so a clean
      # runner has no route types and tsc fails before it ever sees real code.
      - run: npx next typegen

      # Data validation, type checking and the cart/WhatsApp/reply-hours
      # assertions all gate the deploy. A broken catalog must not reach Pages.
      - run: npx tsc --noEmit
      - run: npx eslint .

      - name: Build static export
        run: npx next build

      # Runs after the build on purpose: a third of these assertions read the
      # generated HTML (noindex, JSON-LD, prices, basePath on assets), so they
      # have nothing to inspect until the export exists.
      - run: node scripts/check-all.mjs

      # Pages is served by a plain file server; without this, paths beginning
      # with an underscore (_next) are skipped by Jekyll.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
