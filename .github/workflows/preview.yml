# Build every pull request the way production is built, and keep the result.
#
# Until 9 September 2026 this repository had no environment between a developer's
# machine and the live site: `pages.yml` triggers on push to `main`, so every
# merge went straight to production. Thirty QA test cases sat at "cannot be
# executed" for want of a URL to open, and a mistake had nowhere to surface
# except in front of buyers.
#
# This workflow does not publish anything. It builds the same static export
# production builds, runs the full assertion suite against that export, and
# uploads it so QA can download and open the exact bytes that would ship:
#
#   unzip the artifact, then from web/:  npm run preview
#
# SITE_ENV is deliberately NOT "production" here. The preview export carries
# `Disallow: /` in robots.txt, so if it ever reaches somewhere public it cannot
# be indexed and compete with the real site.
name: Pratinjau pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older build irrelevant; cancel it.
# The opposite of pages.yml, where a half-finished deploy is the danger.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      STATIC_EXPORT: "1"
      # Same shape as production. An export built without basePath looks fine
      # locally and then 404s every asset on Pages, which is exactly the class
      # of bug a preview exists to catch.
      BASE_PATH: /titikasalkopi
      SITE_ENV: preview
      NEXT_PUBLIC_SITE_ORIGIN: https://yuzansama.github.io
      NEXT_PUBLIC_TRACKING_ENDPOINT: https://script.google.com/macros/s/AKfycbzGbe4W2zxmPp9fErxcbG9MN2ZSau4qAjmyNNrmSke56_FJvakzr_HAyECwoVWdMQ74RQ/exec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx next build

      # Reads the generated HTML, so it only means anything after the build.
      # Includes the 190 KB gzip budget gate (NFR-03, D-04).
      - run: node scripts/check-all.mjs

      - name: Verify the preview refuses indexing
        run: |
          if ! grep -q "Disallow: /" out/robots.txt; then
            echo "robots.txt does not disallow crawling; this export must not be published."
            cat out/robots.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pratinjau-${{ github.event.pull_request.number || github.run_id }}
          path: web/out
          retention-days: 14
