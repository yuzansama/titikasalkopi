# Render one vertical promo video per product from the site's catalog.
# Runs when the catalog or the promo template changes, and from the Actions tab.
name: promo-videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "promo/**"
      - "web/src/data/**"
      - "web/src/images/produk/**"
      - "web/public/produk/**"
      - ".github/workflows/promo-videos.yml"
  pull_request:
    paths:
      - "promo/**"
      - ".github/workflows/promo-videos.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: promo/package-lock.json
      - run: npm ci
      - run: npx remotion browser ensure
      - run: npm run render:all
      - uses: actions/upload-artifact@v4
        with:
          name: promo-videos
          path: promo/out/*.mp4
